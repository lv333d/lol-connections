# Netlify config kept as a fallback host — production runs on Vercel (vercel.json). Netlify serves 404.html and
# guess.html at /guess (pretty URLs) by default.

# Connections was removed: its old addresses go to the Grid in the same language.
[[redirects]]
  from = "/connections"
  to = "/"
  status = 301

[[redirects]]
  from = "/:lang/connections"
  to = "/:lang"
  status = 301
[build]
  command = "node scripts/build-site.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Daily data is fetched with a cache-busting query, but keep HTML/JSON revalidated anyway.
[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "noindex"

# Portraits and logos never change under the same name.
[[headers]]
  for = "/players/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
