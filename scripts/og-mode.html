<!DOCTYPE html>
<!-- Source of assets/og/<mode>-<lang>.png (1200×630 link previews, one per game and language).
     Opened by scripts/make-og-images.js as og-mode.html?mode=guess|path|grid&lang=en|pl|es|fr. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Cinzel'; font-weight: 600 800; src: url('../assets/fonts/cinzel-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: 'Cinzel'; font-weight: 600 800; src: url('../assets/fonts/cinzel-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02FF, U+1E00-1EFF; }
  @font-face { font-family: 'Montserrat'; font-weight: 400 800; src: url('../assets/fonts/montserrat-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
  @font-face { font-family: 'Montserrat'; font-weight: 400 800; src: url('../assets/fonts/montserrat-latin-ext.woff2') format('woff2'); unicode-range: U+0100-02FF, U+1E00-1EFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(55% 60% at 8% 0%, rgba(63, 208, 232, 0.16), transparent 70%),
      radial-gradient(50% 55% at 95% 5%, rgba(200, 170, 110, 0.16), transparent 70%),
      radial-gradient(70% 50% at 70% 110%, rgba(63, 208, 232, 0.08), transparent 70%),
      #050811;
    color: #f0e6d2; font-family: 'Montserrat', sans-serif;
    display: grid; grid-template-columns: 1fr 440px; align-items: center; gap: 40px; padding: 0 72px;
  }
  body::before { content: ''; position: absolute; inset: 18px; border: 2px solid rgba(200, 170, 110, 0.32); border-radius: 18px; pointer-events: none; }
  body::after { content: ''; position: absolute; left: 18px; right: 18px; top: 18px; height: 5px; border-radius: 18px 18px 0 0; background: linear-gradient(90deg, #3fd0e8, #c8aa6e 55%, #785a28); }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 64px; height: 64px; }
  .brand span { font-family: 'Cinzel', serif; font-weight: 800; font-size: 34px; color: #c8aa6e; letter-spacing: 1px; }
  h1 { margin-top: 34px; font-family: 'Cinzel', serif; font-weight: 800; font-size: 82px; line-height: 1.02; color: #f0e6d2;
       text-shadow: 0 3px 0 rgba(0, 0, 0, 0.45); white-space: nowrap; }
  .tagline { margin-top: 22px; font-size: 34px; font-weight: 700; line-height: 1.25; color: #f0e6d2; max-width: 600px; }
  .url { display: inline-flex; align-items: center; gap: 10px; margin-top: 34px; padding: 10px 22px; border-radius: 999px;
         border: 2px solid rgba(63, 208, 232, 0.7); color: #3fd0e8; font-size: 28px; font-weight: 800; letter-spacing: 0.5px; }
  .art { display: flex; align-items: center; justify-content: center; height: 440px; }

  /* Guess the Pro: the mystery card and a guess row of coloured tiles. */
  .card { width: 380px; padding: 26px; border-radius: 18px; border: 2px solid rgba(200, 170, 110, 0.5); background: rgba(14, 22, 40, 0.85);
          box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6); }
  .card-top { display: flex; gap: 22px; align-items: center; }
  .silhouette { position: relative; width: 120px; height: 140px; border-radius: 12px; border: 2px solid #c8aa6e; background: #101a30; overflow: hidden; }
  .silhouette::before { content: ''; position: absolute; left: 50%; top: 26px; width: 52px; height: 52px; margin-left: -26px; border-radius: 50%; background: #2a3a5c; }
  .silhouette::after { content: ''; position: absolute; left: 50%; bottom: -30px; width: 100px; height: 80px; margin-left: -50px; border-radius: 50% 50% 0 0; background: #2a3a5c; }
  .q { position: absolute; right: -2px; bottom: -2px; width: 40px; height: 40px; border-radius: 10px 0 10px 0; background: #c8aa6e; color: #050811;
       font: 800 28px/40px 'Cinzel', serif; text-align: center; z-index: 2; }
  .lines span { display: block; height: 16px; border-radius: 8px; background: rgba(240, 230, 210, 0.22); filter: blur(2px); margin: 12px 0; }
  .tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 24px; }
  .tiles i { height: 46px; border-radius: 8px; }
  .g { background: linear-gradient(160deg, #2f8f5b, #1d5c3a); }
  .y { background: linear-gradient(160deg, #c9a43a, #7a5f17); }
  .r { background: linear-gradient(160deg, #a83a42, #5e1c22); }

  /* Career Path: a chain of team circles, two revealed. */
  .chain { display: flex; flex-direction: column; gap: 26px; align-items: center; }
  .chain-row { display: flex; align-items: center; }
  .node { width: 92px; height: 92px; border-radius: 50%; border: 3px solid rgba(200, 170, 110, 0.55); background: #101a30;
          display: flex; align-items: center; justify-content: center; font: 800 34px 'Cinzel', serif; color: rgba(240, 230, 210, 0.35); }
  .node.open { border-color: #3fd0e8; background: radial-gradient(circle at 40% 35%, #1d3b52, #0c1626); color: #3fd0e8; }
  .node.gold { border-color: #c8aa6e; color: #c8aa6e; }
  .link { width: 34px; height: 4px; background: rgba(200, 170, 110, 0.5); }
  .guesses { display: flex; gap: 10px; }
  .guesses i { width: 54px; height: 54px; border-radius: 10px; }

  /* Grid 3x3: the board with a few cells found. */
  .board { display: grid; grid-template-columns: 86px repeat(3, 100px); grid-template-rows: 86px repeat(3, 100px); gap: 10px; }
  .axis { border-radius: 12px; border: 2px solid rgba(200, 170, 110, 0.35); background: rgba(20, 30, 52, 0.8); }
  .corner { border: 0; background: none; display: flex; align-items: center; justify-content: center; }
  .corner img { width: 52px; }
  .cell { border-radius: 12px; border: 2px solid rgba(200, 170, 110, 0.3); background: rgba(30, 42, 68, 0.55); }
  .cell.on { background: linear-gradient(160deg, #2f8f5b, #1d5c3a); border-color: #4cc38a; }
  .cell.gold { background: linear-gradient(160deg, #c8aa6e, #785a28); border-color: #f0e6d2; }
  .axis.cyan { border-color: rgba(63, 208, 232, 0.6); }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../icon.svg" alt=""><span>LoL Connect</span></div>
    <h1 id="mode"></h1>
    <p class="tagline" id="tagline"></p>
    <p class="url">lolconnect.net</p>
  </div>
  <div class="art" id="art"></div>
<script>
  const TEXT = {
    guess: { name: 'Guess the Pro', en: 'Guess the League of Legends pro player of the day', pl: 'Zgadnij codziennego pro-gracza League of Legends',
             es: 'Adivina el jugador pro de League of Legends del día', fr: 'Devinez le joueur pro de League of Legends du jour' },
    path: { name: 'Career Path', en: 'Name the pro player from the teams of their career', pl: 'Zgadnij pro-gracza po drużynach z jego kariery',
            es: 'Adivina el jugador pro por los equipos de su carrera', fr: 'Trouvez le joueur pro grâce aux équipes de sa carrière' },
    grid: { name: 'Grid 3×3', en: 'Find a pro player for every row and column', pl: 'Znajdź pro-gracza do każdego wiersza i kolumny',
            es: 'Encuentra un jugador pro para cada fila y columna', fr: 'Trouvez un joueur pro pour chaque ligne et colonne' }
  };
  const ART = {
    guess: `<div class="card"><div class="card-top"><div class="silhouette"><span class="q">?</span></div>
      <div class="lines" style="flex:1"><span style="width:90%"></span><span style="width:65%"></span><span style="width:78%"></span></div></div>
      <div class="tiles"><i class="g"></i><i class="r"></i><i class="g"></i><i class="y"></i><i class="r"></i><i class="g"></i></div>
      <div class="tiles" style="margin-top:8px"><i class="g"></i><i class="g"></i><i class="g"></i><i class="g"></i><i class="g"></i><i class="g"></i></div></div>`,
    path: `<div class="chain"><div class="chain-row"><div class="node">?</div><div class="link"></div><div class="node open">2</div><div class="link"></div><div class="node">?</div></div>
      <div class="chain-row"><div class="node">?</div><div class="link"></div><div class="node gold">5</div></div>
      <div class="guesses"><i class="r"></i><i class="r"></i><i class="g"></i></div></div>`,
    grid: `<div class="board"><div class="axis corner"><img src="../icon.svg" alt=""></div><div class="axis cyan"></div><div class="axis"></div><div class="axis cyan"></div>
      <div class="axis"></div><div class="cell on"></div><div class="cell"></div><div class="cell on"></div>
      <div class="axis cyan"></div><div class="cell"></div><div class="cell gold"></div><div class="cell on"></div>
      <div class="axis"></div><div class="cell on"></div><div class="cell on"></div><div class="cell"></div></div>`
  };
  const q = new URLSearchParams(location.search);
  const mode = TEXT[q.get('mode')] ? q.get('mode') : 'guess';
  const lang = ['en', 'pl', 'es', 'fr'].includes(q.get('lang')) ? q.get('lang') : 'en';
  document.documentElement.lang = lang;
  document.getElementById('mode').textContent = TEXT[mode].name;
  document.getElementById('tagline').textContent = TEXT[mode][lang];
  document.getElementById('art').innerHTML = ART[mode];
</script>
</body>
</html>
