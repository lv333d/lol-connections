<!DOCTYPE html>
<!-- Source of assets/og-image.png (1200×630 social preview). Rebuild: node scripts/og-image.js -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Cinzel'; font-weight: 600 800; src: url('../assets/fonts/cinzel-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 400 800; src: url('../assets/fonts/montserrat-latin.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 30% 35%, #13203a 0%, #050811 75%);
    color: #f0e6d2; font-family: 'Montserrat', sans-serif;
    display: flex; align-items: center; gap: 56px; padding: 0 70px;
    border: 3px solid rgba(200, 170, 110, 0.35);
  }
  .text { flex: 1; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 92px; height: 92px; }
  h1 { font-family: 'Cinzel', serif; font-weight: 800; font-size: 66px; letter-spacing: 1px; white-space: nowrap; color: #c8aa6e;
       text-shadow: 0 4px 24px rgba(200, 170, 110, 0.25); }
  .tagline { margin-top: 30px; font-size: 38px; font-weight: 700; line-height: 1.25; }
  .modes { margin-top: 26px; font-size: 25px; white-space: nowrap; font-weight: 500; color: #a0a5b5; }
  .modes b { color: #c8aa6e; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(3, 100px); gap: 12px; }
  .cell { width: 100px; height: 100px; border-radius: 12px; border: 2px solid rgba(200, 170, 110, 0.35);
          background: rgba(30, 42, 68, 0.55); }
  .cell.on { background: linear-gradient(160deg, #2f8f5b, #1d5c3a); border-color: #4cc38a; }
  .cell.gold { background: linear-gradient(160deg, #c8aa6e, #785a28); border-color: #f0e6d2; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../icon.svg" alt=""><h1>LoL Connect</h1></div>
    <p class="tagline">Daily League of Legends<br>esports puzzles</p>
    <p class="modes"><b>Grid 3×3</b> — guess the pro players · <b>Connections</b></p>
  </div>
  <div class="grid">
    <div class="cell on"></div><div class="cell"></div><div class="cell on"></div>
    <div class="cell"></div><div class="cell gold"></div><div class="cell on"></div>
    <div class="cell on"></div><div class="cell on"></div><div class="cell"></div>
  </div>
</body>
</html>
