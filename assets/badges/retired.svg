<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mouse hung up on a hook">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b08250"/><stop offset="1" stop-color="#74502b"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b7488"/><stop offset=".5" stop-color="#3a4252"/><stop offset="1" stop-color="#1c2129"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b56e"/><stop offset="1" stop-color="#7a5a24"/>
    </linearGradient>
    <!-- hides the stretch of cable behind the hook's tip, so the hook itself is drawn once, in one piece -->
    <mask id="behind-tip" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M39 22v-7" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- wall board -->
  <rect x="10" y="2" width="44" height="7" rx="2" fill="url(#wood)" stroke="#3e2914" stroke-width="1.3"/>
  <path d="M14 5.5h10M33 5.5h16" stroke="#5a3a1c" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <!-- 1. the whole J hook: shaft, cup, upturned tip -->
  <path d="M29 8v14a5 5 0 0 0 10 0v-7" fill="none" stroke="#3a2d14" stroke-width="5" stroke-linecap="round"/>
  <path d="M29 8v14a5 5 0 0 0 10 0v-7" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <!-- 2. cable draped over the hook: comes up from the mouse in front of the cup, passes behind the upper
       part of the tip (masked out there) and hangs down outside to the plug -->
  <g mask="url(#behind-tip)">
  <path d="M30 35c0-4 .6-7.5 2.2-10.5s3.4-5.6 5.4-6.8c1.8-1.1 3.6-1.4 4.8-.5c1.2.9 1.4 2.6 1.4 4.8v5.8"
        fill="none" stroke="#0f1217" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 35c0-4 .6-7.5 2.2-10.5s3.4-5.6 5.4-6.8c1.8-1.1 3.6-1.4 4.8-.5c1.2.9 1.4 2.6 1.4 4.8v5.8"
        fill="none" stroke="#3d4555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- plug on the loose end -->
  <rect x="41.4" y="27.5" width="4.4" height="6.5" rx="1" fill="#c8aa6e" stroke="#3a2d14" stroke-width="1"/>
  <path d="M42.7 34v2M44.5 34v2" stroke="#3a2d14" stroke-width="1" stroke-linecap="round"/>
  <!-- mouse, hanging by its cable (covers the cable's end) -->
  <g transform="rotate(-5 30 48)">
    <path d="M30 33c-9 0-12.5 6-12.5 13.5v4c0 8 5.2 11.5 12.5 11.5s12.5-3.5 12.5-11.5v-4c0-7.5-3.5-13.5-12.5-13.5z" fill="url(#shell)" stroke="#0f1217" stroke-width="1.8"/>
    <path d="M30 33.5v12.5" stroke="#0f1217" stroke-width="1.6"/>
    <path d="M17.8 46.3h24.4" stroke="#0f1217" stroke-width="1.3" opacity=".75"/>
    <rect x="28.3" y="36.8" width="3.4" height="6.2" rx="1.7" fill="#c8aa6e" stroke="#3a2d14" stroke-width=".8"/>
    <path d="M21.5 43.5c.8-4.4 3.4-7.3 7-8.1" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>
  </g>
</svg>
