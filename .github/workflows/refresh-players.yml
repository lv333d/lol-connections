# Monthly refresh of the LoL Grid player database from Leaguepedia (new rosters, retirements, Worlds/MSI winners).
# Boards from tomorrow on get their answers recomputed (same conditions); today's and past boards keep theirs.
# A full import takes ~30–60 min because Leaguepedia rate-limits Cargo queries.
name: Refresh player database

on:
  schedule:
    - cron: '0 3 1 * *'
    # Day after the Worlds final (2026: Sun 15 Nov, 12:00 CET) — the new world champions count from the next board.
    - cron: '0 11 15 11 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-updates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild player database
        env:
          LEAGUEPEDIA_BOT_USER: ${{ secrets.LEAGUEPEDIA_BOT_USER }}
          LEAGUEPEDIA_BOT_PASSWORD: ${{ secrets.LEAGUEPEDIA_BOT_PASSWORD }}
        run: node scripts/build-player-db.js --fresh
      - name: Rebuild Guess the Pro pool (current teams, titles)
        continue-on-error: true
        env:
          LEAGUEPEDIA_BOT_USER: ${{ secrets.LEAGUEPEDIA_BOT_USER }}
          LEAGUEPEDIA_BOT_PASSWORD: ${{ secrets.LEAGUEPEDIA_BOT_PASSWORD }}
        # Then redraw upcoming days whose player left the pool, and top the days up.
        run: node scripts/build-guess-pool.js --fresh && node scripts/generate-guess.js --days=14
      - name: Recompute answers of upcoming boards
        continue-on-error: true
        run: node scripts/generate-grid.js --date=$(date -u -d '+1 day' +%F) --days=14 --recompute
      - name: Fetch missing portraits and logos
        continue-on-error: true
        env:
          LEAGUEPEDIA_BOT_USER: ${{ secrets.LEAGUEPEDIA_BOT_USER }}
          LEAGUEPEDIA_BOT_PASSWORD: ${{ secrets.LEAGUEPEDIA_BOT_PASSWORD }}
        run: node scripts/fetch-assets.js
      - name: Commit database
        run: |
          git config user.name "lv333d"
          git config user.email "137284250+lv333d@users.noreply.github.com"
          git add data/ grid/ guess/ players/ assets/logos/ assets/flags/
          git diff --cached --quiet || git commit -m "Player database refresh $(date -u +%F)"
          git push
