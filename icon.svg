<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0E6D2"/>
      <stop offset="0.5" stop-color="#C8AA6E"/>
      <stop offset="1" stop-color="#785A28"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CDFAFA"/>
      <stop offset="0.4" stop-color="#0AC8B9"/>
      <stop offset="1" stop-color="#0397AB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tło + złota ramka -->
  <rect x="6" y="6" width="244" height="244" rx="36" fill="#010A13" stroke="url(#gold)" stroke-width="5"/>
  <rect x="14" y="14" width="228" height="228" rx="30" fill="none" stroke="#005A82" stroke-width="1.5" opacity="0.8"/>

  <!-- siatka 4x4: pole 190x190, komórka 43, odstęp 6 -->

  <!-- ciemne paski -->
  <g fill="#0A323C" stroke="#005A82" stroke-width="1">
    <rect x="82"  y="33"  width="43" height="43" rx="6"/>
    <rect x="180" y="33"  width="43" height="43" rx="6"/>
    <rect x="82"  y="82"  width="92" height="43" rx="6"/>
    <rect x="131" y="131" width="92" height="43" rx="6"/>
  </g>

  <!-- złote kwadraty -->
  <g fill="url(#gold)">
    <rect x="131" y="33"  width="43" height="43" rx="6"/>
    <rect x="180" y="82"  width="43" height="43" rx="6"/>
    <rect x="82"  y="131" width="43" height="43" rx="6"/>
  </g>

  <!-- litera L -->
  <path filter="url(#glow)" fill="url(#cyan)"
        d="M39 33 H70 A6 6 0 0 1 76 39 V174 A6 6 0 0 0 82 180 H217 A6 6 0 0 1 223 186 V217 A6 6 0 0 1 217 223 H39 A6 6 0 0 1 33 217 V39 A6 6 0 0 1 39 33 Z"/>
</svg>
