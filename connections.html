<body>
  <div class="app">
    <header>
      <div class="logo">
        <h1><img src="icon.svg" alt="LoL Connect Logo" class="header-logo-icon"> LoL Connect</h1>
        <p id="subtitle" data-i18n="subtitle">cotygodniowa zagadka League of Legends</p>
      </div>
      <nav class="game-tabs" aria-label="Game mode">
        <a href="/" class="game-tab"><span class="game-tab-icon">▦</span>Grid</a>
        <a href="/guess" class="game-tab"><span class="game-tab-icon">?</span>Guess the Pro</a>
        <a href="/connections" class="game-tab active" aria-current="page"><span class="game-tab-icon">▤</span>Connections</a>
      </nav>
      <div class="header-controls">
        <div class="lang-wrap">
          <span class="lang-icon">🌐</span>
          <select id="langSelect" class="lang-select">
            <option value="pl">PL</option>
            <option value="en">EN</option>
            <option value="es">ES</option>
            <option value="fr">FR</option>
          </select>
        </div>
        <div class="date-nav-wrap">
          <button id="btnPrevDate" class="date-nav-btn">&lt;</button>
          <div id="dateDisplay" class="date-display"></div>
          <button id="btnNextDate" class="date-nav-btn">&gt;</button>
        </div>
        <div class="header-buttons">
          <button id="btnGuide" class="text-btn">
            <span class="text-btn-icon">📖</span>
            <span id="btnGuideLabel" data-i18n="btnGuideLabel">Poradnik</span>
          </button>
          <button id="btnSuggest" class="text-btn">
            <span class="text-btn-icon">✉</span>
            <span id="btnSuggestLabel" data-i18n="btnSuggestLabel">Propozycja</span>
          </button>
        </div>
      </div>
    </header>

    <div id="nextBoard" class="next-board hidden"></div>
    <div id="puzzleCredit" class="puzzle-credit hidden"></div>

    <div id="noPuzzleScreen" class="no-puzzle hidden">
      <h2 id="noPuzzleTitle" data-i18n="noPuzzleTitle"></h2>
      <p id="noPuzzleText" data-i18n="noPuzzleText"></p>
    </div>

    <div id="gameArea" class="game-area hidden">
      <div class="lives-row">
        <span id="livesLabel" data-i18n="livesLabel" class="lives-label"></span>
        <div id="livesPips" class="lives-pips"></div>
      </div>
      <div id="progressBar" class="progress-bar"></div>
      <div id="solvedBanners" class="solved-banners"></div>
      <div class="grid-wrap">
        <div id="tileGrid" class="tile-grid"></div>
      </div>
      <div id="hintMsg" class="hint-msg"></div>
      <div class="actions">
        <button id="btnDeselect" data-i18n="deselect" class="btn btn-secondary">Odznacz</button>
        <button id="btnSubmit" data-i18n="submit" class="btn" disabled>Zatwierdź</button>
        <button id="btnShowResults" data-i18n="results" class="btn hidden">Wyniki</button>
      </div>
    </div>
  </div>

  <!-- Overlay: Results Popup -->
  <div id="resultOverlay" class="overlay hidden">
    <div class="modal">
      <button class="modal-close" data-close="resultOverlay">&times;</button>
      <h2 id="resultTitle"></h2>
      <div id="emojiGrid" class="emoji-grid"></div>
      <div class="result-actions">
        <button id="btnShare" data-i18n="share" class="btn">𝕏 Udostępnij wynik</button>
        <button id="btnCopy" data-i18n="copy" class="btn btn-secondary">📋 Kopiuj wynik</button>
      </div>
    </div>
  </div>

  <!-- Overlay: Guide -->
  <div id="guideOverlay" class="overlay hidden">
    <div class="modal">
      <button class="modal-close" data-close="guideOverlay">&times;</button>
      <h2 id="guideTitle" data-i18n="guideTitle">📖 Poradnik</h2>
      <div id="guideContent"></div>
    </div>
  </div>

  <!-- Overlay: Suggestion -->
  <div id="suggestOverlay" class="overlay hidden">
    <div class="modal">
      <button class="modal-close" data-close="suggestOverlay">&times;</button>
      <div id="suggestFormView">
        <h2 id="suggestTitle" data-i18n="suggestTitle">✉ Propozycja planszy</h2>
        <div class="form-group">
          <label id="suggestNickLabel" data-i18n="suggestNick" for="suggestNick">Nick (opcjonalnie)</label>
          <input type="text" id="suggestNick" data-i18n-ph="suggestNickPh" maxlength="40">
        </div>
        <div class="form-group">
          <label id="suggestCategoryLabel" data-i18n="suggestCategory" for="suggestCategory">Kategoria</label>
          <input type="text" id="suggestCategory" data-i18n-ph="suggestCategoryPh" maxlength="160">
        </div>
        <div class="form-group">
          <label id="suggestExamplesLabel" data-i18n="suggestExamples" for="suggestExamples">Przykładowi gracze (opcjonalnie)</label>
          <input type="text" id="suggestExamples" data-i18n-ph="suggestExamplesPh" maxlength="400">
        </div>
        <div class="form-group">
          <label id="suggestNotesLabel" data-i18n="suggestNotes" for="suggestNotes">Dodatkowe uwagi</label>
          <textarea id="suggestNotes" data-i18n-ph="suggestNotesPh" maxlength="500"></textarea>
        </div>
        <div id="suggestError" class="form-error hidden"></div>
        <button id="btnSuggestSubmit" data-i18n="suggestSubmit" class="btn" style="width:100%;margin-top:10px;">Wyślij propozycję</button>
      </div>
      <div id="suggestSuccessView" class="success-screen hidden">
        <div id="suggestSuccessIcon" class="check">✅</div>
        <h2 id="suggestSuccessTitle" data-i18n="suggestSuccessTitle">Dziękujemy!</h2>
        <p id="suggestSuccessText" data-i18n="suggestSuccessText">Twoja propozycja została zapisana.</p>
        <div id="suggestCopyContainer" class="hidden" style="margin-top:15px;">
          <textarea id="suggestCopyArea" readonly style="width:100%;height:80px;font-size:0.75rem;margin-bottom:8px;"></textarea>
          <button id="btnSuggestCopyCode" class="btn btn-secondary">Kopiuj kod</button>
        </div>
        <button id="btnSuggestClose" data-i18n="suggestClose" class="btn" style="margin-top:20px;">Zamknij</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="site.js"></script>
  <script src="app.js"></script>
  <script src="footer.js"></script>
</body>
</html>
